\* This is the configuration file for the ionia specification.
CONSTANTS
  Nodes={n1,n2,n3}
  Clients={c1}
  MaxLogSize=3
  NULL=null
  Values={1, 2}

INVARIANTS 
  TypeInvarient
  LogConsistency
  CommitIndexMonotonic
  AppliedIndexBounded
  LeaderUniqueness
  MessageIntegrity
  NoDataLoss

PROPERTIES
  EventuallyCommitted
  EventuallyDurabilityCommitted
  ClientRequestEventuallyProcessed
  LeaderEventuallyActive
  SystemEventuallyResponsive
  ProgressEventuallyMade
  MajorityConsensusEventuallyReached
  SystemRecoversFromStalls
  LeaderEventuallyCommits
  FollowersEventuallySync

SPECIFICATION Spec
